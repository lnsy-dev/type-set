<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="type-set">
  <meta property="og:type" content="article" />
  <meta property="og:image" content="">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:description" content="A canvas-based typography editor">
  <meta property="og:site_name" content="type-set">

  <title>type-set</title>
</head>

<body>
  <div class="app">
    <aside class="controls">
      <h2>Type Controls</h2>

      <div class="control-group">
        <label for="font-family">Font Family</label>
        <select id="font-family">
          <option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option>
          <option value="Cormorant Garamond">Cormorant Garamond</option>
          <option value="Crimson Text">Crimson Text</option>
          <option value="EB Garamond">EB Garamond</option>
          <option value="Fira Code">Fira Code</option>
          <option value="IBM Plex Sans">IBM Plex Sans</option>
          <option value="IBM Plex Serif" selected>IBM Plex Serif</option>
          <option value="League Gothic">League Gothic</option>
          <option value="Spectral">Spectral</option>
          <option value="UnifrakturMaguntia">UnifrakturMaguntia</option>
        </select>
      </div>

      <div class="control-group">
        <label for="text-align">Text Align</label>
        <select id="text-align">
          <option value="left" selected>Left</option>
          <option value="right">Right</option>
          <option value="center">Center</option>
          <option value="justify">Justify</option>
        </select>
      </div>

      <div class="control-group">
        <label for="font-size">
          Font Size: <span id="font-size-val">48</span>px
        </label>
        <input type="range" id="font-size" min="12" max="200" value="48">
      </div>

      <div class="control-group" id="weight-group">
        <label for="font-weight">
          Weight: <span id="font-weight-val">400</span>
          <span id="weight-scope" class="scope-label">(global)</span>
        </label>
        <div class="row">
          <input type="range" id="font-weight" min="100" max="900" step="100" value="400">
          <button id="clear-weight" type="button">Clear</button>
        </div>
        <p class="hint">Select text to adjust weight for just those characters.</p>
      </div>

      <div class="control-group">
        <button id="toggle-italic" type="button">Italic</button>
      </div>

      <div class="control-group" id="spacing-group">
        <label for="spacing">
          Spacing: <span id="spacing-val">0</span>px
          <span id="spacing-scope" class="scope-label">(global)</span>
        </label>
        <div class="row">
          <input type="range" id="spacing" min="-10" max="20" step="0.5" value="0">
          <button id="clear-spacing" type="button">Clear</button>
        </div>
        <p class="hint">Select text to adjust spacing for just those characters.</p>
      </div>

      <div class="control-group">
        <label for="line-height">
          Line Height: <span id="line-height-val">1.2</span>
        </label>
        <input type="range" id="line-height" min="0.8" max="3.0" step="0.05" value="1.2">
      </div>

      <div class="control-group">
        <label>Typography</label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="use-ligatures" checked> Ligatures</label>
          <label><input type="checkbox" id="use-kerning" checked> Kerning</label>
          <label><input type="checkbox" id="use-hyphenation" checked> Auto Hyphenation</label>
        </div>
      </div>

      <div class="control-group">
        <label for="color">Color</label>
        <input type="color" id="color" value="#0a5c0a">
      </div>

      <div class="control-group actions">
        <button id="export-svg" type="button">Export Vector SVG</button>
        <button id="export-png" type="button">Export PNG @ 600 DPI</button>
      </div>
    </aside>

    <main class="stage">
      <type-set
        id="editor"
        font-family="IBM Plex Serif"
        font-base="./fonts/"
        font-size="48"
        font-weight="400"
        font-style="normal"
        letter-spacing="0"
        line-height="1.2"
        color="#0a5c0a"
      >The quick brown fox jumps over the lazy dog.</type-set>
    </main>
  </div>

</body>
</html>
